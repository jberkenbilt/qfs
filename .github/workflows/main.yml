name: qfs build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  AWS_REGION: "us-east-1"
jobs:
  Build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform:
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Test
        run: ./test_all
